<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <marker id="h" markerWidth="5" markerHeight="4" refX="4" refY="2" orient="auto">
      <polygon points="0 0, 5 2, 0 4" fill="#C2785C"/>
    </marker>
  </defs>
  <!-- Directed edges: A->B, B->C, C->A (the impossible cycle) -->
  <line x1="18" y1="6.5" x2="25" y2="20" stroke="#C2785C" stroke-width="1.8" marker-end="url(#h)"/>
  <line x1="24" y1="24" x2="9" y2="24" stroke="#C2785C" stroke-width="1.8" marker-end="url(#h)"/>
  <line x1="8" y1="21" x2="14" y2="7.5" stroke="#C2785C" stroke-width="1.8" marker-end="url(#h)"/>
  <!-- Nodes -->
  <circle cx="16" cy="5" r="3.5" fill="#5B8A72"/>
  <circle cx="26.5" cy="23.5" r="3.5" fill="#5B8A72"/>
  <circle cx="5.5" cy="23.5" r="3.5" fill="#5B8A72"/>
</svg>
